services:
  unifi-documenter:
    # Use pre-built image (recommended)
    #image: ghcr.io/loryanstrant/unifi-documenter:latest
    
    # OR build locally (comment out 'image' line above and uncomment below)
    build: .
    
    container_name: unifi-documenter
    restart: unless-stopped
    
    # Resource limits to prevent system overload
    deploy:
      resources:
        limits:
          cpus: '2.0'          # Maximum 2 CPU cores
          memory: 2G           # Maximum 2GB RAM
        reservations:
          cpus: '0.5'          # Reserve at least 0.5 CPU cores
          memory: 512M         # Reserve at least 512MB RAM
    
    # Additional resource controls
    mem_swappiness: 0            # Disable swap to prevent disk thrashing
    oom_kill_disable: false      # Allow OOM killer if needed (safety)
    pids_limit: 200              # Limit number of processes
    
    environment:
      # Schedule Configuration
      - SCHEDULE_FREQUENCY=${SCHEDULE_FREQUENCY}  # daily, weekly, monthly
      - SCHEDULE_TIME=${SCHEDULE_TIME}       # HH:MM format (24-hour)
      - SCHEDULE_DAY=${SCHEDULE_DAY}            # For weekly (1=Monday, 7=Sunday), for monthly (1-31)
      - TIMEZONE=${TIMEZONE}              # Timezone for scheduling
      
      # UDM Configuration
      - UDM_IP=${UDM_IP}
      - UDM_ROOT_PASSWORD=${UDM_ROOT_PASSWORD}
      - REMOTE_BACKUP_DIR=${REMOTE_BACKUP_DIR}
      
      # AI Configuration
      - AI_PROVIDER=${AI_PROVIDER}        # openai, ollama, azure-openai, custom
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      
      # Optional Ollama Configuration (if AI_PROVIDER=ollama)
      # - OLLAMA_URL=http://host.docker.internal:11434
      # - OLLAMA_MODEL=llama3
      
      # Optional Azure OpenAI Configuration (if AI_PROVIDER=azure-openai)
      # - AZURE_OPENAI_ENDPOINT=https://your-resource.openai.azure.com/
      # - AZURE_OPENAI_API_VERSION=2024-02-01
      # - AZURE_OPENAI_DEPLOYMENT=your-deployment-name
      
      # Output Configuration
      - OUTPUT_FORMAT=${OUTPUT_FORMAT}    # markdown, json, both
      - MAX_DOCUMENT_SIZE=${MAX_DOCUMENT_SIZE}   # Maximum characters per document chunk
      - INCLUDE_RAW_DATA=${INCLUDE_RAW_DATA}    # Include raw JSON in output

      #run mode
      - RUN_MODE=${RUN_MODE}              # normal, test, debug
      - RUN_IMMEDIATELY=${RUN_IMMEDIATELY}
      
    volumes:
      - ./output:/app/output
      - ./config:/app/config:ro
    networks:
      - unifi-net

networks:
  unifi-net:
    driver: bridge
